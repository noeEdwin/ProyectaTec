name: proyectatec

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proyectatec_dev
      POSTGRES_USER: proyectatec
      POSTGRES_PASSWORD: proyectatec_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proyectatec -d proyectatec_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /var/www/html
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      COMPOSER_HOME: /tmp/composer
    depends_on:
      postgres:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000
    init: true

volumes:
  postgres_data:
