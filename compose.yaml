name: proyectatec

services:
  backend:
    build:
      context: ./backend
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /var/www/html
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      COMPOSER_HOME: /tmp/composer
    command: php artisan serve --host=0.0.0.0 --port=8000
    init: true
